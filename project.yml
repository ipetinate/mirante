name: Mirante
options:
  bundleIdPrefix: com.mirante
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Mirante:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Mirante
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirante.Mirante
        PRODUCT_NAME: Mirante
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Mirante
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Mirante
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: O Mirante usa Bluetooth para instalar watchfaces no relógio pareado.
        TARGETED_DEVICE_FAMILY: "1,2"
      sdk "macosx*":
        CODE_SIGN_ENTITLEMENTS: Mirante/Resources/Mirante.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  MiranteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MiranteTests
    dependencies:
      - target: Mirante
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirante.MiranteTests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Mirante.app/Contents/MacOS/Mirante
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Mirante:
    build:
      targets:
        Mirante: all
        MiranteTests: [test]
    test:
      targets:
        - MiranteTests
