name: Store Build

on:
  push:
    branches: [main]
    paths:
      - "faces/**"
  workflow_dispatch:

concurrency:
  group: store-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # TODO(user): install / invoke the closed Mi watch-face compiler here.
      # For every `faces/*/*/face.fprj` changed in this push, produce the HTML
      # ZIP bundle expected by the band and save it as `face.bin` next to it.
      # Mirante's publish step has already written `face.fprj`, `metadata.json`
      # and `preview.png`. This job must only:
      #   1. run the toolchain to compile face.fprj -> face.bin
      #   2. (below) regenerate the root index.json from all metadata.json files
      - name: Build faces
        shell: pwsh
        run: echo "TODO: compile each changed faces/*/*/face.fprj into face.bin"

      - name: Regenerate store index
        shell: pwsh
        run: python .github/scripts/rebuild_index.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            Write-Host "no changes"
          } else {
            git commit -m "build(store): compile faces and regenerate index"
            git push
          }